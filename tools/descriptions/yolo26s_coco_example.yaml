# Example description for a model the app has never seen: Ultralytics YOLO26-S (COCO, 80 classes) exported to ONNX
#   yolo export model=yolo26s.pt format=onnx imgsz=640 opset=17      -> images [1,3,640,640], output0 [1,300,6]
# YOLO26 is NMS-free: output0 rows are x1, y1, x2, y2, conf, class id in 640x640 letterbox px, sorted by confidence.
# Package it with:
#   python tools/package_model.py --onnx yolo26s.onnx --description tools/descriptions/yolo26s_coco_example.yaml \
#       --out models/yolo26s_coco.onnx
schema: gahan-model-description/1
name: YOLO26-S COCO (example)
version: yolo26s-8.4.27
created: '2026-11-06'
precision: fp32
input:
  name: images
  batch: 1
  layout: NCHW
  width: 640
  height: 640
  resize: letterbox
  pad_value: 114
  color: RGB
  scale: 0.00392156862745098
  dtype: float32
detection:
  output: output0
  format: xyxy_conf_cls
  coords: input_px
  classes: [person, bicycle, car, motorcycle, airplane, bus, train, truck, boat, traffic light, fire hydrant, stop sign, parking
      meter, bench, bird, cat, dog, horse, sheep, cow, elephant, bear, zebra, giraffe, backpack, umbrella, handbag, tie, suitcase,
    frisbee, skis, snowboard, sports ball, kite, baseball bat, baseball glove, skateboard, surfboard, tennis racket, bottle,
    wine glass, cup, fork, knife, spoon, bowl, banana, apple, sandwich, orange, broccoli, carrot, hot dog, pizza, donut, cake,
    chair, couch, potted plant, bed, dining table, toilet, tv, laptop, mouse, remote, keyboard, cell phone, microwave, oven,
    toaster, sink, refrigerator, book, clock, vase, scissors, teddy bear, hair drier, toothbrush]
  conf_threshold: 0.25
